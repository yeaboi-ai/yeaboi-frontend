name: AI Review
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
concurrency:
  group: ai-review-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
  issues: read
  actions: read
  id-token: write
jobs:
  claude:
    uses: yeaboi-ai/yeaboi-tooling/.github/workflows/claude-review.yml@45b8df3c2a018d2807230eac1e625d56a83646cf
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
# Codex automatic reviews run through its native GitHub integration and ChatGPT subscription.
# Enable them in Codex repository settings; no API key or exported CLI login is used here.
